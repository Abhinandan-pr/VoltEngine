[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "voltengine"
version = "0.1.0"
description = "Utility-grade electricity billing engine supporting prepaid, LT and HT consumers"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }

authors = [
    { name = "Abhinandan", email = "abhinandanroy165@gmail.com" }
]

keywords = [
    "electricity",
    "billing",
    "prepaid",
    "smart-meter",
    "utility",
    "amisps"
]

classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent"
]

dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.115,<1.0", "pydantic>=2.9,<3.0", "uvicorn[standard]>=0.30,<1.0"]

[tool.setuptools]
py-modules = ["http_api"]

[tool.setuptools.packages.find]
where = ["."]
namespaces = true
include = ["accounting*", "billing*", "engine*", "models*", "operations*", "tariff*"]
